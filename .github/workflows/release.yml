name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      label: ${{ steps.meta.outputs.label }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            "label=dev-$($env:GITHUB_SHA.Substring(0, 7))" >> $env:GITHUB_OUTPUT
            "is_release=false" >> $env:GITHUB_OUTPUT
            "apply_version=false" >> $env:GITHUB_OUTPUT
            return
          }

          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+(\.\d+)?$') { throw "Tag '$tag' must look like v3.0.1 or v3.0.1.0" }

          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag '$tag' does not point at a commit on main." }

          $parts = [System.Collections.Generic.List[string]]::new()
          $tag.Substring(1).Split('.') | ForEach-Object { $parts.Add($_) }
          $version3 = ($parts[0..2] -join '.')
          while ($parts.Count -lt 4) { $parts.Add('0') }
          $version4 = ($parts[0..3] -join '.')

          "label=$tag" >> $env:GITHUB_OUTPUT
          "is_release=true" >> $env:GITHUB_OUTPUT
          "apply_version=true" >> $env:GITHUB_OUTPUT
          "version3=$version3" >> $env:GITHUB_OUTPUT
          "version4=$version4" >> $env:GITHUB_OUTPUT

      - name: Apply version to project files
        if: steps.meta.outputs.apply_version == 'true'
        shell: pwsh
        env:
          VERSION3: ${{ steps.meta.outputs.version3 }}
          VERSION4: ${{ steps.meta.outputs.version4 }}
        run: |
          $csproj = 'src/Toolbox/Toolbox.csproj'
          $cs = Get-Content -LiteralPath $csproj -Raw
          $cs = $cs -replace '<Version>[^<]+</Version>', "<Version>$env:VERSION3</Version>"
          $cs = $cs -replace '<AssemblyVersion>[^<]+</AssemblyVersion>', "<AssemblyVersion>$env:VERSION4</AssemblyVersion>"
          $cs = $cs -replace '<FileVersion>[^<]+</FileVersion>', "<FileVersion>$env:VERSION4</FileVersion>"
          $cs = $cs -replace '<InformationalVersion>[^<]+</InformationalVersion>', "<InformationalVersion>$env:VERSION3</InformationalVersion>"
          Set-Content -LiteralPath $csproj -Value $cs -NoNewline

          $manifest = 'src/Toolbox/Package.appxmanifest'
          [xml]$xml = Get-Content -LiteralPath $manifest
          $xml.Package.Identity.Version = $env:VERSION4
          $xml.Save((Resolve-Path -LiteralPath $manifest).Path)

      - name: Core tests
        run: dotnet test tests/Toolbox.Core.Tests/Toolbox.Core.Tests.csproj -c Release

      # Signing is optional: without the secrets the release ships with an unsigned manifest and MSIX.
      - name: Prepare signing certificate
        id: cert
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNING_PFX_BASE64)) { "available=false" >> $env:GITHUB_OUTPUT; return }
          $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          "available=true" >> $env:GITHUB_OUTPUT
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Publish unpackaged
        shell: pwsh
        env:
          PFX_PATH: ${{ steps.cert.outputs.path }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:PFX_PATH) {
            $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            .\scripts\publish.ps1 -OutputDir "$PWD\dist\Toolbox" -CertificatePath $env:PFX_PATH -CertificatePassword $password
          } else {
            .\scripts\publish.ps1 -OutputDir "$PWD\dist\Toolbox"
          }

      - name: Zip unpackaged folder
        shell: pwsh
        env:
          LABEL: ${{ steps.meta.outputs.label }}
        run: Compress-Archive -Path "$PWD\dist\Toolbox\*" -DestinationPath "$PWD\dist\Toolbox-$env:LABEL-win-x64.zip" -CompressionLevel Optimal

      - name: Publish MSIX
        shell: pwsh
        env:
          PFX_PATH: ${{ steps.cert.outputs.path }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:PFX_PATH) {
            $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            .\scripts\publish-msix.ps1 -OutputDir "$PWD\dist\msix" -CertificatePath $env:PFX_PATH -CertificatePassword $password
          } else {
            .\scripts\publish-msix.ps1 -OutputDir "$PWD\dist\msix"
          }

      - name: Remove signing certificate
        if: always() && steps.cert.outputs.available == 'true'
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'signing.pfx') -Force -ErrorAction SilentlyContinue

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\Toolbox-*-win-x64.zip, dist\msix\*.msix |
            ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Toolbox-${{ steps.meta.outputs.label }}
          path: |
            dist/Toolbox-*-win-x64.zip
            dist/msix/*.msix
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Toolbox-${{ needs.build.outputs.label }}
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Toolbox-*-win-x64.zip
            dist/msix/*.msix

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/Toolbox-*-win-x64.zip
            dist/msix/*.msix
            dist/SHA256SUMS.txt
