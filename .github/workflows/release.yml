name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve version label
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $label = $env:GITHUB_REF_NAME
          } else {
            $label = "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "label=$label" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Artifact label: $label"

      - name: Publish unpackaged (win-x64)
        shell: pwsh
        run: .\scripts\publish.ps1 -OutputDir "$PWD\dist\Toolbox"

      - name: Zip unpackaged folder
        shell: pwsh
        run: |
          $zip = Join-Path $PWD "dist\Toolbox-$($env:LABEL)-win-x64.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path "$PWD\dist\Toolbox\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
        env:
          LABEL: ${{ steps.meta.outputs.label }}

      - name: Publish MSIX (unsigned)
        shell: pwsh
        run: .\scripts\publish-msix.ps1 -OutputDir "$PWD\dist\msix"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-${{ steps.meta.outputs.label }}
          path: |
            dist/Toolbox-*-win-x64.zip
            dist/msix/*.msix
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Toolbox-*-win-x64.zip
            dist/msix/*.msix
