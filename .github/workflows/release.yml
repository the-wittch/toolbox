name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce

      - name: Resolve version from tag
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            "label=dev-$($env:GITHUB_SHA.Substring(0, 7))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "apply_version=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Manual run: keeping versions from repo files"
            return
          }

          $tag = $env:GITHUB_REF_NAME
          $raw = $tag.TrimStart('v', 'V')
          if ($raw -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Tag '$tag' must look like v2.0.1 or v2.0.1.0"
          }

          $parts = [System.Collections.Generic.List[string]]::new()
          $raw.Split('.') | ForEach-Object { $parts.Add($_) }
          while ($parts.Count -lt 3) { $parts.Add('0') }
          $version3 = ($parts[0..2] -join '.')
          while ($parts.Count -lt 4) { $parts.Add('0') }
          $version4 = ($parts[0..3] -join '.')

          "label=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version3=$version3" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version4=$version4" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "apply_version=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release version: $version3 / $version4 (from $tag)"

      - name: Apply version to project files
        if: steps.meta.outputs.apply_version == 'true'
        shell: pwsh
        env:
          VERSION3: ${{ steps.meta.outputs.version3 }}
          VERSION4: ${{ steps.meta.outputs.version4 }}
        run: |
          $csproj = 'src/Toolbox/Toolbox.csproj'
          $manifest = 'src/Toolbox/Package.appxmanifest'
          $cs = Get-Content -LiteralPath $csproj -Raw
          $cs = $cs -replace '<Version>[^<]+</Version>', "<Version>$env:VERSION3</Version>"
          $cs = $cs -replace '<AssemblyVersion>[^<]+</AssemblyVersion>', "<AssemblyVersion>$env:VERSION4</AssemblyVersion>"
          $cs = $cs -replace '<FileVersion>[^<]+</FileVersion>', "<FileVersion>$env:VERSION4</FileVersion>"
          $cs = $cs -replace '<InformationalVersion>[^<]+</InformationalVersion>', "<InformationalVersion>$env:VERSION3</InformationalVersion>"
          Set-Content -LiteralPath $csproj -Value $cs -NoNewline

          [xml]$xml = Get-Content -LiteralPath $manifest
          $xml.Package.Identity.Version = $env:VERSION4
          $xml.Save((Resolve-Path -LiteralPath $manifest).Path)
          Write-Host "Wrote $env:VERSION3 / $env:VERSION4 into csproj + Package.appxmanifest"

      - name: Publish unpackaged (win-x64)
        shell: pwsh
        run: .\scripts\publish.ps1 -OutputDir "$PWD\dist\Toolbox"

      - name: Zip unpackaged folder
        shell: pwsh
        run: |
          $zip = Join-Path $PWD "dist\Toolbox-$($env:LABEL)-win-x64.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path "$PWD\dist\Toolbox\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
        env:
          LABEL: ${{ steps.meta.outputs.label }}

      - name: Publish MSIX (unsigned)
        shell: pwsh
        run: .\scripts\publish-msix.ps1 -OutputDir "$PWD\dist\msix"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Toolbox-${{ steps.meta.outputs.label }}
          path: |
            dist/Toolbox-*-win-x64.zip
            dist/msix/*.msix
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          files: |
            dist/Toolbox-*-win-x64.zip
            dist/msix/*.msix
